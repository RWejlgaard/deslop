name: Release

# Squash-merged PRs land as a single commit on main. Its subject line drives
# the release:
#   major: ...   -> major version bump (breaking change)
#   feat: ...    -> minor version bump (new feature)
#   fix: ...     -> patch version bump (bug fix)
#   chore: ...   -> no release
#   anything else -> no release
#
# All platform builds must succeed before anything is tagged or released:
# plan -> build (matrix) -> tag -> release.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    # The version-bump commit itself carries [skip ci], so GitHub normally
    # never schedules this workflow for it. This check is a second line of
    # defense (e.g. against manual re-runs).
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release plan
        id: plan
        run: |
          set -euo pipefail

          subject="$(git log -1 --pretty=%s)"
          echo "Commit subject: $subject"

          if echo "$subject" | grep -qE '^major(\(.+\))?!?:'; then
            bump=major
          elif echo "$subject" | grep -qE '^feat(\(.+\))?!?:'; then
            bump=minor
          elif echo "$subject" | grep -qE '^fix(\(.+\))?!?:'; then
            bump=patch
          else
            bump=none
          fi
          echo "Bump: $bump"

          if [ "$bump" = none ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$last_tag" ]; then
            base="${last_tag#v}"
          else
            base="$(sed -nE 's/^version = "(.*)"/\1/p' Cargo.toml | head -1)"
          fi
          echo "Base version: $base"

          IFS='.' read -r major minor patch <<< "$base"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new_version="${major}.${minor}.${patch}"

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$new_version" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Bake the version that will be tagged into the binary (CARGO_PKG_VERSION)
      # without committing it -- the real, committed bump happens in `tag`,
      # only after every platform here has built successfully.
      - name: Set crate version for this build
        shell: bash
        run: |
          set -euo pipefail
          sed -i "0,/^version = \".*\"/s//version = \"${{ needs.plan.outputs.version }}\"/" Cargo.toml

      - name: Add Rust target
        if: "!matrix.cross"
        run: rustup target add ${{ matrix.target }}

      - name: Set up cross-compilation toolchain
        if: matrix.cross
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          src="target/${{ matrix.target }}/release/deslop"
          dest="dist/deslop-${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *-windows-* ]]; then
            src="${src}.exe"
            dest="${dest}.exe"
          fi
          cp "$src" "$dest"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  tag:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version in Cargo.toml and Cargo.lock
        run: |
          set -euo pipefail
          version="${{ needs.plan.outputs.version }}"

          sed -i "0,/^version = \".*\"/s//version = \"${version}\"/" Cargo.toml

          python3 - "$version" <<'EOF'
          import re, sys
          version = sys.argv[1]
          with open("Cargo.lock") as f:
              content = f.read()
          content = re.sub(
              '(name = "deslop"\nversion = ")[^"]*(")',
              lambda m: f'{m.group(1)}{version}{m.group(2)}',
              content,
              count=1,
          )
          with open("Cargo.lock", "w") as f:
              f.write(content)
          EOF

      - name: Commit and tag
        run: |
          set -euo pipefail
          tag="${{ needs.plan.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): ${tag} [skip ci]"
          git tag -a "$tag" -m "Release $tag"
          git push origin HEAD:main
          git push origin "$tag"

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Create release and attach binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.tag.outputs.tag }}"
          gh release create "$tag" --title "$tag" --generate-notes dist/*
